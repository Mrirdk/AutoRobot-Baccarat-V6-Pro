name: Build AutoRobot Baccarat V6 Pro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Project & Build Debug APK
        run: |
          PROJECT_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "LOI: Chua thay file settings.gradle.kts va thu muc app/ tren repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Dang build du an tai: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Package AutoRobot-Baccarat-V6-Pro.apk
        run: |
          mkdir -p dist
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          cp "$APK_PATH" dist/AutoRobot-Baccarat-V6-Pro.apk

      - name: Upload V6 Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRobot-Baccarat-V6-Pro-APK
          path: dist/AutoRobot-Baccarat-V6-Pro.apk
