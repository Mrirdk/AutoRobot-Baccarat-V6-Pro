name: Build AutoRobot Baccarat V6 Pro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Package AutoRobot-Baccarat-V6-Pro.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AutoRobot-Baccarat-V6-Pro.apk

      - name: Upload V6 Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRobot-Baccarat-V6-Pro-APK
          path: dist/AutoRobot-Baccarat-V6-Pro.apk
